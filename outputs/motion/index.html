<!doctype html><meta charset="utf-8"><title>PT camera 动态模型</title><style>body{max-width:1100px;margin:30px auto;font:18px sans-serif}video,img{width:100%}</style><h1>PT camera 三维运动仿真</h1><p>相机位置固定，pan/tilt随时间变化，两个地面目标独立运动。左：三维几何；右上：有效图像测量；右下：角度时间曲线。红色虚线表示目标当前不可观测。</p><video controls loop playsinline preload="metadata" poster="preview.png"><source src="pt_motion.mp4" type="video/mp4"></video><p>本演示采用预设运动学轨迹，不包含马达动力学、反馈控制或实拍验证。轨迹和模型每一帧计算图像坐标；遮挡/出界时无测量。噪声关闭。</p><p><a href="pt_motion.gif">GIF动画</a> | <a href="measurements.csv">逐帧数据</a></p>
